---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Java runtime
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ local_jar }}"
    dest: "{{ app_directory }}/{{ app_jar }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart quote generator

- name: Install systemd service
  ansible.builtin.template:
    src: quote-generator.service.j2
    dest: /etc/systemd/system/quote-generator.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart quote generator

- name: Enable and start quote generator
  ansible.builtin.systemd_service:
    name: quote-generator
    enabled: yes
    state: started
    daemon_reload: yes
