apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quote-generator
  template:
    metadata:
      labels:
        app: quote-generator
    spec:
      containers:
        - name: quote-generator
          image: quote-generator:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
